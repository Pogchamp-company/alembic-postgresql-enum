version: "3.8"

services:
  run-tests:
#    entrypoint: pytest
    build: .
    stdin_open: true
    tty: true
    environment:
      DATABASE_URI: postgresql://test_user:test_password@db:5432/test_db
    depends_on:
      - db
    links:
      - "db:database"
  db:
    image: postgres:12
    environment:
      POSTGRES_DB: "test_db"
      POSTGRES_USER: "test_user"
      POSTGRES_PASSWORD: "test_password"
      PGUSER: "postgres"
